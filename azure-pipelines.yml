trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

############################################################
# BUILD
############################################################

stages:

- stage: Build
  displayName: "Build Stage"

  jobs:

  - job: BuildJob

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
      displayName: Upgrade pip

    - script: |
        pip install -r requirements.txt
      displayName: Install Dependencies

    - script: |
        python --version
        pip --version
      displayName: Verify Python

    - script: |
        python -m compileall src
      displayName: Compile Project

############################################################
# QUALITY
############################################################

- stage: Quality
  displayName: "Quality Checks"

  dependsOn: Build

  jobs:

  - job: Lint

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install -r requirements.txt
      displayName: Install Dependencies

    - script: |
        black --check .
      displayName: Black

    - script: |
        ruff check .
      displayName: Ruff

############################################################
# TEST
############################################################

- stage: Testing
  displayName: "Unit Testing"

  dependsOn: Quality

  jobs:

  - job: Tests

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install -r requirements.txt
      displayName: Install Dependencies

    - script: |
        python -m pytest tests/unit \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=10
      displayName: Run Unit Tests

    - task: PublishCodeCoverageResults@2
      displayName: Publish Code Coverage
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'

############################################################
# PACKAGE
############################################################

- stage: Package
  displayName: "Package"

  dependsOn: Testing

  jobs:

  - job: Docker
    displayName: "Build & Push Docker Image"

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: AzureCLI@2
      displayName: Login to Azure and Push Docker Image

      inputs:
        azureSubscription: 'AI-Agent-ServiceConnection'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          echo "======================================"
          echo "Logging into Azure..."
          echo "======================================"

          az account show

          echo "======================================"
          echo "Logging into Azure Container Registry..."
          echo "======================================"

          az acr login --name aiagentregistry2027

          echo "======================================"
          echo "Building Docker Image..."
          echo "======================================"

          docker build \
            -t aiagentregistry2027.azurecr.io/ai-agent:latest \
            -t aiagentregistry2027.azurecr.io/ai-agent:$(Build.BuildId) . || exit 1

          echo "======================================"
          echo "Pushing Docker Images..."
          echo "======================================"

          docker push aiagentregistry2027.azurecr.io/ai-agent:latest || exit 1

          docker push aiagentregistry2027.azurecr.io/ai-agent:$(Build.BuildId) || exit 1

          echo "======================================"
          echo "Docker Push Completed Successfully"
          echo "======================================"